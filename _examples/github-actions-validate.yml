# Check an s3-sync configuration kept in another repository on every change.
# Secrets are not needed: --no-env treats unset variables as "0".
# Put this file into .github/workflows/ of that repository.
name: s3-sync config

on:
  pull_request:
    paths: ["s3-sync/config.yaml"]
  push:
    paths: ["s3-sync/config.yaml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: >
          docker run --rm
          -v "$PWD/s3-sync/config.yaml:/etc/s3-sync/config.yaml:ro"
          ghcr.io/metanovii/s3-sync:latest
          --config /etc/s3-sync/config.yaml validate --no-env
